# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See https://fullsend.sh/docs/guides/infrastructure/layered-config-reference
version: "1"
runtime: dummy
roles:
    - triage
    - coder
    - review
    - fix
    - retro
    - prioritize
agents:
    - name: local-base
      source: harness/local-base.yaml
    - name: local-child
      source: harness/local-child.yaml
    - name: remote-base-child
      source: harness/remote-base-child.yaml
    - name: remote-child
      source: https://raw.githubusercontent.com/fullsend-ai-test/bt-20260906T171832-4bcb6329-base-harness-host/main/harness/remote-child.yaml#sha256=5113a1965702efd2f0551bbad01ac9fc2eacc2ebb92657ce95a3a8184f12d2b7
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
    - https://raw.githubusercontent.com/fullsend-ai-test/bt-20260906T171832-4bcb6329-base-harness-host/
create_issues:
    allow_targets:
        repos:
            - fullsend-ai-test/bt-20260906T171832-4bcb6329
            - fullsend-ai/fullsend
